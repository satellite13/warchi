{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "warchi.fullname" . }}-config
  labels:
    {{- include "warchi.labels" . | nindent 4 }}
data:
  API_BASE_URL: {{ .Values.api.baseUrl | quote }}
  NOTATION_URL: {{ .Values.api.notationUrl | quote }}
{{- end }}

