{{- define "warchi.deploymentSpec" -}}
{{- $ctx := .ctx -}}
{{- if not $ctx.Values.autoscaling.enabled }}
replicas: {{ $ctx.Values.replicaCount }}
{{- end }}
selector:
  matchLabels:
    {{- include "warchi.selectorLabels" $ctx | nindent 4 }}
    {{- if .color }}
    app.kubernetes.io/color: {{ .color | quote }}
    {{- end }}
template:
  metadata:
    {{- with $ctx.Values.podAnnotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    labels:
      {{- include "warchi.labels" $ctx | nindent 6 }}
      {{- if .color }}
      app.kubernetes.io/color: {{ .color | quote }}
      {{- end }}
      {{- with $ctx.Values.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  spec:
    {{- with $ctx.Values.imagePullSecrets }}
    imagePullSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    serviceAccountName: {{ include "warchi.serviceAccountName" $ctx }}
    {{- with $ctx.Values.podSecurityContext }}
    securityContext:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    containers:
      - name: {{ $ctx.Chart.Name }}
        {{- with $ctx.Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ $ctx.Values.image.repository }}:{{ .imageTag }}"
        imagePullPolicy: {{ $ctx.Values.image.pullPolicy }}
        ports:
          - name: http
            containerPort: {{ $ctx.Values.service.port }}
            protocol: TCP
        {{- if $ctx.Values.configMap.enabled }}
        env:
          - name: API_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: {{ include "warchi.fullname" $ctx }}-config
                key: API_BASE_URL
          - name: NOTATION_URL
            valueFrom:
              configMapKeyRef:
                name: {{ include "warchi.fullname" $ctx }}-config
                key: NOTATION_URL
        {{- else }}
        env:
          - name: API_BASE_URL
            value: {{ $ctx.Values.api.baseUrl | quote }}
          - name: NOTATION_URL
            value: {{ $ctx.Values.api.notationUrl | quote }}
        {{- end }}
        {{- with $ctx.Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $ctx.Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $ctx.Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $ctx.Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $ctx.Values.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- with $ctx.Values.volumes }}
    volumes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $ctx.Values.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $ctx.Values.affinity }}
    affinity:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $ctx.Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end -}}

{{- if .Values.blueGreen.enabled }}
{{- $defaultTag := .Values.image.tag | default .Chart.AppVersion -}}
{{- $blueTag := .Values.blueGreen.image.blueTag | default $defaultTag -}}
{{- $greenTag := .Values.blueGreen.image.greenTag | default $defaultTag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warchi.fullname" . }}-blue
  labels:
    {{- include "warchi.labels" . | nindent 4 }}
    app.kubernetes.io/color: "blue"
spec:
  {{- include "warchi.deploymentSpec" (dict "ctx" . "color" "blue" "imageTag" $blueTag) | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warchi.fullname" . }}-green
  labels:
    {{- include "warchi.labels" . | nindent 4 }}
    app.kubernetes.io/color: "green"
spec:
  {{- include "warchi.deploymentSpec" (dict "ctx" . "color" "green" "imageTag" $greenTag) | nindent 2 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warchi.fullname" . }}
  labels:
    {{- include "warchi.labels" . | nindent 4 }}
spec:
  {{- include "warchi.deploymentSpec" (dict "ctx" . "color" "" "imageTag" (.Values.image.tag | default .Chart.AppVersion)) | nindent 2 }}
{{- end }}
