# Preprod values
replicaCount: 1

image:
  repository: art.lmru.tech/arch/warchi
  pullPolicy: IfNotPresent

blueGreen:
  enabled: true
  activeColor: "blue"

imagePullSecrets:
  # Uncomment if needed:
  # - name: art-lmru-tech

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: ${INGRESS_HOST:-t-warchi.lmru.tech}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: warchi-preprod-tls
      hosts:
        - ${INGRESS_HOST:-t-warchi.lmru.tech}
