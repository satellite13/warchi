# Default values for warchi.
# Environment-specific overrides are applied via deploy.sh --set flags.

replicaCount: 2

image:
  repository: art.lmru.tech/arch/warchi
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.10.14"

blueGreen:
  enabled: true
  activeColor: "blue"
  image:
    blueTag: ""
    greenTag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  # TLS (self-signed cert baked into the image; required for browser HTTPS-First on *.cluster.local)
  tlsPort: 8443

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: $INGRESS_HOST
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: warchi-tls
      hosts:
        - $INGRESS_HOST

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Probes: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 30
  timeoutSeconds: 3
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingress:
    allowFromIngressController: true
    controllerNamespace: ingress-nginx
    extraFrom: []
  egress:
    allowDns: true
    areposServer:
      enabled: true
      name: arepos-server
      instance: arepos-server
      port: 8080
    extraRules: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Writable paths for nginx with readOnlyRootFilesystem.
volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}

volumeMounts:
  - name: nginx-cache
    mountPath: /var/cache/nginx
  - name: nginx-run
    mountPath: /var/run

nodeSelector: {}
tolerations: []
affinity: {}

api:
  baseUrl: ""
  notationUrl: "/api/v1/notation"

configMap:
  enabled: true
  name: ""
