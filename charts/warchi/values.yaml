# Default values for warchi.
# Environment-specific overrides are applied via deploy.sh --set flags.

replicaCount: 2

image:
  repository: art.lmru.tech/arch/warchi
  pullPolicy: IfNotPresent
  tag: ""

blueGreen:
  enabled: true
  activeColor: "blue"
  image:
    blueTag: ""
    greenTag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: warchi.lmru.tech
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: warchi-tls
      hosts:
        - warchi.lmru.tech

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

api:
  baseUrl: ""
  notationUrl: "/api/v1/notation"

configMap:
  enabled: true
  name: ""
