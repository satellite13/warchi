services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arepos
      POSTGRES_USER: arepos
      POSTGRES_PASSWORD: arepos
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arepos -d arepos']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.46.0
    command: server --config=/config/cerbos.yaml
    volumes:
      - ./infra/docker/cerbos.yaml:/config/cerbos.yaml:ro
      - ../arepos-server/authz/cerbos/policies:/policies:ro
    healthcheck:
      test: ['CMD', 'cerbos', 'healthcheck']
      interval: 5s
      timeout: 3s
      retries: 20

  arepos-server:
    build:
      context: ../arepos-server
    environment:
      DB_URL: jdbc:postgresql://postgresql:5432/arepos
      DB_USERNAME: arepos
      DB_PASSWORD: arepos
      FILE_STORAGE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: arepos-files
      JWT_SECRET: local-development-secret-change-before-exposing
      ADMIN_SECRET: local-development-admin-secret
      AREPOS_AUTHZ_CERBOS_ENDPOINT: http://cerbos:3592
      MODEL_SYNC_OUTBOX_ENABLED: 'true'
    depends_on:
      postgresql:
        condition: service_healthy
      minio:
        condition: service_healthy
      cerbos:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/actuator/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      default:
        aliases:
          - arepos-server.arch.svc.cluster.local

  warchi:
    build:
      context: .
      additional_contexts:
        papirus: ../papirus
      args:
        VITE_API_BASE_URL: ''
        VITE_NOTATION_URL: /api/v1/notation
        VITE_SITE_URL: ''
        VITE_SITE_RETURN_ORIGINS: ''
        APP_VERSION: local
    ports:
      - '8080:80'
    depends_on:
      arepos-server:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
