map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Auth endpoints keep tight limits; general /api/ is unlimited — SPA bursts
# (notation import, parallel catalog loads) exceed 30r/s + burst=20 in normal use.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# nginx limit_req supports r/s and r/m only (~3/h approximated as 1r/m + burst=1)
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=refresh_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=health_limit:10m rate=60r/m;

server {
  listen 80;
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  root /usr/share/nginx/html;
  index index.html;

  # Match arepos file limits (site assets 20 MB; leave headroom for multipart overhead).
  client_max_body_size 25m;

  # Re-resolve arepos backends: a bare hostname in proxy_pass is fixed at nginx start
  # and breaks /api + /ws after arepos pod IP / endpoint changes.
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
  set $arepos_upstream arepos-server.arch.svc.cluster.local;

  # Security headers (also repeated in locations that set their own add_header —
  # nginx replaces parent add_header when a location defines any add_header).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-XSS-Protection "0" always;

  location = /api/v1/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://$arepos_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/auth/register {
    limit_req zone=register_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://$arepos_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/auth/refresh {
    limit_req zone=refresh_limit burst=15 nodelay;
    limit_req_status 429;
    proxy_pass http://$arepos_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Large OEF XML normalize only; keep general /api at 25m (batch-save stays chunked).
  location ~ ^/api/v1/models/[^/]+/oef/normalize$ {
    client_max_body_size 100m;
    proxy_pass http://$arepos_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /api/ {
    proxy_pass http://$arepos_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # STOMP model sync (live diagram + remote pointer for spectators); same path as Vite dev proxy.
  # ^~ — чтобы не перехватил regex из других конфигов; иначе /ws часто уходит в try_files → 200 + index.html.
  location ^~ /ws {
    access_log off;
    proxy_pass http://$arepos_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
  }

  location /assets/ {
    limit_req zone=static_limit burst=50 nodelay;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # SVG icons: no rate limit (IconPicker may load many in parallel; limit_req defaults to 503).
  location /icons/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # Deep SPA routes may resolve chunk URLs as /route/assets/*.js — serve real files from /assets/.
  location ~ ^/.+/assets/(.+)$ {
    rewrite ^/.+/assets/(.*)$ /assets/$1 last;
  }

  location = /health {
    access_log off;
    limit_req zone=health_limit burst=5 nodelay;
    limit_req_status 429;
    default_type application/json;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /health.json =503;
  }

  location = /version.json {
    limit_req zone=static_limit burst=50 nodelay;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /index.html {
    limit_req zone=static_limit burst=50 nodelay;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    try_files $uri =404;
  }

  location / {
    limit_req zone=static_limit burst=50 nodelay;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    try_files $uri $uri/ /index.html;
  }
}
