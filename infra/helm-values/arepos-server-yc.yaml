# Helm values override для arepos-server в Yandex Cloud
# Замените <REGISTRY_ID> на реальный ID из terraform output registry_id

image:
  repository: cr.yandex/<REGISTRY_ID>/arepos-server
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: yc-cr-pull-secret

# Отключаем in-cluster PostgreSQL — используем Yandex Managed PostgreSQL
postgresql:
  enabled: false

# Отключаем in-cluster MinIO — используем Yandex Object Storage
minio:
  enabled: false

# DB credentials из K8s secret (создаётся скриптом create-secrets.sh)
database:
  existingSecret: "arepos-db-secret"

# S3 и auth env vars — передаём напрямую, т.к. minio.enabled=false
env:
  - name: FILE_STORAGE
    value: "minio"
  - name: MINIO_ENDPOINT
    value: "https://storage.yandexcloud.net"
  - name: MINIO_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: arepos-s3-secret
        key: access-key
  - name: MINIO_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: arepos-s3-secret
        key: secret-key
  - name: MINIO_BUCKET
    value: "<S3_BUCKET_NAME>"
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: arepos-server-auth-secret
        key: jwt-secret
  - name: ADMIN_SECRET
    valueFrom:
      secretKeyRef:
        name: arepos-server-auth-secret
        key: admin-secret
  # Model live sync outbox (arepos-server: docs/ops/model-sync-outbox-runbook.md). true — после миграции 034 и осознанного включения.
  - name: MODEL_SYNC_OUTBOX_ENABLED
    value: "true"

# Cerbos (in-cluster) в режиме ENFORCE
cerbos:
  enabled: true
  deploy: true
  mode: "ENFORCE"

authz:
  cerbosShadowEnabled: false
  cerbosEnforceEnabled: true
  cerbosFailOpen: false

# В ENFORCE-режиме и при холодном старте инициализация может быть долгой.
startupProbe:
  failureThreshold: 60
  periodSeconds: 10
  initialDelaySeconds: 30
  timeoutSeconds: 5

# ENFORCE + Liquibase + JPA инициализация требует больше памяти на старте.
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
