replicaCount: 1

image:
  repository: arch/warchi-site
  pullPolicy: IfNotPresent
  tag: "0.2.1"

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: arch-redirect-https@kubernetescrd
  hosts:
    - host: warchi.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: warchi-site-ru-tls
      hosts:
        - warchi.ru
