apiVersion: v1
kind: Service
metadata:
  name: warchi
  namespace: arch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: warchi
    app.kubernetes.io/name: warchi
---
apiVersion: v1
kind: Service
metadata:
  name: arepos-server
  namespace: arch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: arepos-server
    app.kubernetes.io/name: arepos-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arch-edge-nginx-config
  namespace: arch
data:
  default.conf: |
    server {
      listen 8081;
      server_name _;

      location / {
        proxy_pass http://warchi.arch.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }

    server {
      listen 8082;
      server_name _;

      location / {
        proxy_pass http://arepos-server.arch.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arch-edge-nginx
  namespace: arch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arch-edge-nginx
  template:
    metadata:
      labels:
        app: arch-edge-nginx
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - name: frontend
              containerPort: 8081
              hostPort: 8081
              protocol: TCP
            - name: backend
              containerPort: 8082
              hostPort: 8082
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: arch-edge-nginx-config
